<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Matcher</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png"
          href="{{ url_for('static', filename='images.png') }}">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .container {
            margin-top: 50px;
        }

        .card {
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .card-header {
            background-color: #007bff;
            color: white;
            border-radius: 10px 10px 0 0;
            padding: 10px 20px;
        }

        .card-body {
            padding: 20px;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card">

            <div class="card-header">
                <h2>Job Description & Matcher</h2>
            </div>

            <div class="card-body">

                <form action="/matcher" method="post" enctype="multipart/form-data">

                    <div class="form-group">
                        <label for="job_description">Job Description</label>

                        <textarea
                            class="form-control"
                            id="job_description"
                            name="job_description"
                            rows="5"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="resumes">Upload Resumes</label>

                        <p>Please Upload More Than 5 Resumes</p>

                        <input
                            type="file"
                            id="resumes"
                            name="resumes"
                            multiple
                            required
                            accept=".pdf,.docx,.txt">
                    </div>

                    <br>

                    <button type="submit" class="btn btn-primary">
                        Match Resume
                    </button>

                </form>

                {% if message %}
                    <div class="alert alert-info mt-4">
                        <p>{{ message }}</p>

                        <ul>
                            {% for index in range(top_resumes|length) %}
                                <li>
                                    {{ top_resumes[index] }}
                                    (Similarity Score:
                                    {{ similarity_scores[index] }})
                                </li>
                            {% endfor %}
                        </ul>
                    </div>
                {% endif %}

            </div>
        </div>
    </div>

</body>
</html>
